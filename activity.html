<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Registrar Atividade - FATFIT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <button onclick="history.back()" class="btn-back">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1>📸 Registrar Atividade</h1>
            <div style="width: 40px;"></div>
        </header>

        <div class="activity-content">
            <div id="selectedGroups" class="selected-groups"></div>
            <div id="registerInfo" class="register-info"></div>
            <div id="submitInfo" class="submit-info"></div>

            <form id="activityForm">
                <div class="camera-container">
                    <video id="cameraPreview" autoplay playsinline></video>
                    <canvas id="photoCanvas" style="display: none;"></canvas>
                    <img id="photoResult" style="display: none;">
                    <div class="camera-controls">
                        <button type="button" id="captureBtn" class="btn-capture">
                            <i class="fas fa-camera"></i> Tirar Foto
                        </button>
                        <button type="button" id="retakeBtn" class="btn-retake" style="display: none;">
                            <i class="fas fa-redo"></i> Refazer
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label><i class="fas fa-comment"></i> Comentário (opcional)</label>
                    <textarea id="activityComment" rows="3" placeholder="Adicione um comentário sobre sua atividade..."></textarea>
                </div>

                <div class="location-controls">
                    <button type="button" id="getLocationBtn" class="btn-location">
                        <i class="fas fa-map-marker-alt"></i> Capturar Localização
                    </button>
                    <button type="button" id="skipLocationBtn" class="btn-skip">
                        <i class="fas fa-skip"></i> Pular
                    </button>
                    <div id="locationStatus" class="location-status"></div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    <i class="fas fa-check"></i> Registrar Atividade
                </button>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts na ordem correta -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
