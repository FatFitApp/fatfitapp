<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>FATFIT - Registrar Atividade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reset para tela cheia */
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
        }
    </style>
</head>
<body class="activity-page">
    
    <!-- ESTADO 1: CÂMERA FULLSCREEN -->
    <div id="cameraState" class="camera-fullscreen">
        <video id="cameraPreview" autoplay playsinline></video>
        <div class="camera-controls">
            <button class="camera-capture-btn" id="captureBtn">
                <div class="capture-ring"></div>
            </button>
        </div>
    </div>

    <!-- ESTADO 2: PRÉ-VISUALIZAÇÃO -->
    <div id="previewState" class="preview-fullscreen" style="display:none;">
        <img id="photoPreview" src="" alt="Foto">
        <div class="preview-controls">
            <button class="btn btn-outline preview-btn" id="retakeBtn">
                <i class="fas fa-redo"></i> Tirar outra
            </button>
            <button class="btn btn-primary preview-btn" id="usePhotoBtn">
                <i class="fas fa-check"></i> Usar esta
            </button>
        </div>
    </div>

    <!-- ESTADO 3: DETALHES -->
    <div id="detailsState" style="display:none; overflow-y:auto; height:100vh;">
        <header class="app-header">
            <button class="icon-btn" onclick="goBackToCamera()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 class="app-title">Registrar Atividade</h1>
            <div></div>
        </header>

        <main class="main-content">
            <!-- Grupos selecionados -->
            <section class="section">
                <div id="selectedGroups" class="mb-2"></div>
                <p class="text-xs text-muted" id="registerInfo"></p>
            </section>

            <!-- Foto miniatura -->
            <section class="section text-center">
                <img id="photoThumb" src="" alt="Foto" class="photo-thumb">
            </section>

            <!-- Localização -->
            <section class="section">
                <div class="card">
                    <div class="flex-between mb-1">
                        <span>📍 Localização</span>
                        <span id="locationStatus">Não capturada</span>
                    </div>
                    <div id="locationAddress" class="location-address" style="display:none;"></div>
                    <div class="flex-between mt-1">
                        <button class="btn btn-outline btn-sm" id="getLocationBtn">
                            <i class="fas fa-map-marker-alt"></i> Capturar
                        </button>
                        <button class="btn btn-text btn-sm" id="skipLocationBtn">
                            Pular
                        </button>
                    </div>
                </div>
            </section>

            <!-- Comentário -->
            <section class="section">
                <form id="activityForm">
                    <div class="input-group">
                        <label for="activityComment">💬 Comentário (opcional)</label>
                        <textarea id="activityComment" rows="3" placeholder="Como foi seu treino hoje?" maxlength="500"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                        <i class="fas fa-check-circle"></i> Registrar Atividade
                    </button>
                    <p class="text-xs text-muted text-center mt-1" id="submitInfo"></p>
                </form>
            </section>
        </main>

        <div class="toast-container" id="toastContainer"></div>
    </div>

    <canvas id="photoCanvas" hidden></canvas>
    <div class="toast-container" id="toastContainerFixed" style="position:fixed; top:20px; left:20px; right:20px; z-index:9999;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
