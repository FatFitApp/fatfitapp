<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4F46E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>FATFIT - Meu Perfil</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4F46E5">
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Apple PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="app-page">
    <header class="app-header">
        <button class="icon-btn" onclick="history.back()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h1 class="app-title">Meu Perfil</h1>
        <button class="icon-btn" id="editProfileBtn">
            <i class="fas fa-cog"></i>
        </button>
    </header>

    <main class="main-content">
        <!-- Container principal que será preenchido pelo setupProfile -->
        <div class="profile-container">
            <div class="loading-state">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p>Carregando perfil...</p>
            </div>
        </div>
    </main>

    <!-- Modal de Detalhes do Dia -->
    <div class="modal" id="dayDetailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="dayDetailTitle">Detalhes do Dia</h3>
                <button class="icon-btn modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="dayDetailBody">
                <!-- Preenchido dinamicamente -->
            </div>
        </div>
    </div>

    <!-- Modal de Edição de Perfil (Fallback) -->
    <div class="modal" id="editProfileModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Perfil</h3>
                <button class="icon-btn modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="editProfileFormModal">
                    <div class="input-group">
                        <label>Nome completo</label>
                        <input type="text" id="editNameModal" class="modern-input" required>
                    </div>
                    <div class="input-group">
                        <label>Chave PIX</label>
                        <input type="text" id="editPixKeyModal" class="modern-input" placeholder="CPF, E-mail, Telefone ou Chave aleatória">
                    </div>
                    <button type="submit" class="btn-modern" style="width: 100%; margin-top: 15px;">
                        <i class="fas fa-save"></i> Salvar Alterações
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal de Troca de Senha (Fallback) -->
    <div class="modal" id="changePasswordModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Alterar Senha</h3>
                <button class="icon-btn modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="changePasswordFormModal">
                    <div class="input-group">
                        <label>Senha atual</label>
                        <input type="password" id="currentPasswordModal" class="modern-input" required>
                    </div>
                    <div class="input-group">
                        <label>Nova senha</label>
                        <input type="password" id="newPasswordModal" class="modern-input" required>
                        <small class="text-muted">Mínimo 6 caracteres</small>
                    </div>
                    <button type="submit" class="btn-outline-modern" style="width: 100%; margin-top: 15px;">
                        <i class="fas fa-key"></i> Alterar Senha
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>

    <!-- Script adicional para compatibilidade -->
    <script>
        // Script para gerenciar os modais de fallback e integração com o setupProfile
        document.addEventListener('DOMContentLoaded', function() {
            // Botão de editar perfil (canto superior direito)
            const editProfileBtn = document.getElementById('editProfileBtn');
            if (editProfileBtn) {
                editProfileBtn.addEventListener('click', function() {
                    // Preencher o modal com os dados atuais
                    const nameEl = document.getElementById('profileName');
                    const pixKeyEl = document.getElementById('editPixKey');
                    
                    const editNameInput = document.getElementById('editNameModal');
                    const editPixInput = document.getElementById('editPixKeyModal');
                    
                    if (editNameInput && nameEl) {
                        editNameInput.value = nameEl.textContent !== 'Usuário' ? nameEl.textContent : '';
                    }
                    if (editPixInput && pixKeyEl) {
                        editPixInput.value = pixKeyEl.value || '';
                    }
                    
                    document.getElementById('editProfileModal').classList.add('open');
                });
            }
            
            // Formulário de edição de perfil do modal
            const editProfileFormModal = document.getElementById('editProfileFormModal');
            if (editProfileFormModal) {
                editProfileFormModal.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const name = document.getElementById('editNameModal').value.trim();
                    const pix = document.getElementById('editPixKeyModal').value.trim();
                    
                    if (!name) {
                        showToast('Nome obrigatório', 'error');
                        return;
                    }
                    
                    const user = await window.getCurrentUser();
                    if (user) {
                        const { error } = await window.db.from('profiles').update({ 
                            name, 
                            pix_key: pix || null 
                        }).eq('id', user.id);
                        
                        if (error) {
                            showToast('Erro ao salvar: ' + error.message, 'error');
                        } else {
                            // Atualizar a interface
                            const profileNameEl = document.getElementById('profileName');
                            if (profileNameEl) profileNameEl.textContent = name;
                            
                            const editPixField = document.getElementById('editPixKey');
                            if (editPixField) editPixField.value = pix;
                            
                            showToast('Perfil atualizado!', 'success');
                            document.getElementById('editProfileModal').classList.remove('open');
                            
                            // Recarregar a página para atualizar tudo
                            setTimeout(() => location.reload(), 1000);
                        }
                    }
                });
            }
            
            // Botão de trocar senha (se existir na nova interface ou via fallback)
            const openChangePwBtn = document.getElementById('openChangePasswordBtn');
            if (openChangePwBtn) {
                openChangePwBtn.addEventListener('click', function() {
                    document.getElementById('changePasswordModal').classList.add('open');
                });
            }
            
            // Formulário de troca de senha
            const changePwFormModal = document.getElementById('changePasswordFormModal');
            if (changePwFormModal) {
                changePwFormModal.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const currentPw = document.getElementById('currentPasswordModal').value;
                    const newPw = document.getElementById('newPasswordModal').value;
                    
                    if (newPw.length < 6) {
                        showToast('Nova senha deve ter no mínimo 6 caracteres', 'error');
                        return;
                    }
                    
                    const user = await window.getCurrentUser();
                    if (user) {
                        const { error } = await window.db.auth.signInWithPassword({ 
                            email: user.email, 
                            password: currentPw 
                        });
                        
                        if (error) {
                            showToast('Senha atual incorreta', 'error');
                            return;
                        }
                        
                        const { error: updateError } = await window.db.auth.updateUser({ password: newPw });
                        if (updateError) {
                            showToast('Erro ao trocar senha: ' + updateError.message, 'error');
                        } else {
                            showToast('Senha alterada com sucesso!', 'success');
                            document.getElementById('changePasswordModal').classList.remove('open');
                            changePwFormModal.reset();
                        }
                    }
                });
            }
            
            // Fechar modais
            document.querySelectorAll('.modal-close').forEach(btn => {
                btn.addEventListener('click', function() {
                    this.closest('.modal').classList.remove('open');
                });
            });
            
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        modal.classList.remove('open');
                    }
                });
            });
        });
        
        // Função auxiliar para mostrar toast (caso não exista)
        if (typeof window.showToast !== 'function') {
            window.showToast = function(message, type) {
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            };
        }
    </script>
    <!-- Registrar Service Worker -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('✅ Service Worker registrado'))
                .catch(err => console.log('❌ Service Worker falhou:', err));
        });
    }
</script>
</body>
</html>
