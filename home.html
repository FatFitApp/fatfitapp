<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <title>FATFIT</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="app-page">
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <img src="logo.png" alt="FATFIT" class="loading-logo">
        <p class="loading-text">Carregando</p>
        <div class="loading-dots">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
        </div>
    </div>

    <!-- Header -->
    <header class="app-header">
        <button class="icon-btn" id="menuBtn">
            <i class="fas fa-bars"></i>
        </button>
        <h1 class="app-title" id="headerGroupName">FATFIT</h1>
        <button class="icon-btn" id="headerAvatar">
            <img id="headerAvatarImg" src="logo.png" alt="Perfil" class="header-avatar">
        </button>
    </header>

    <!-- Menu Lateral -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-profile" id="sidebarProfile">
            <img id="sidebarAvatar" src="logo.png" alt="Avatar" class="sidebar-avatar">
            <div class="sidebar-user-info">
                <strong id="sidebarName">Usuário</strong>
                <span class="text-xs text-muted" id="sidebarEmail">email</span>
            </div>
        </div>
        
        <a href="profile.html" class="sidebar-item">
            <i class="fas fa-user"></i> Meu Perfil
        </a>
                <a href="body.html" class="sidebar-item">
            <i class="fas fa-heart-pulse"></i> Avaliação Física
        </a>
        
        <div class="sidebar-section-title">MEUS GRUPOS</div>
        <div class="sidebar-groups" id="sidebarGroups">
            <div class="loading-state" style="padding:10px;">
                <img src="logo.png" alt="Carregando" class="loading-mini-logo" style="width:40px;height:40px;">
            </div>
        </div>
        
        <button class="sidebar-item" id="createGroupSidebarBtn">
            <i class="fas fa-plus-circle"></i> Criar Novo Grupo
        </button>
        
        <button class="sidebar-item" onclick="window.location.href='search.html'">
            <i class="fas fa-search"></i> Buscar Grupos
        </button>
        
        <button class="sidebar-item sidebar-logout" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i> Sair
        </button>
    </nav>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <div id="noGroupState" class="empty-state" style="display:none;">
            <img src="logo.png" alt="FATFIT" style="width:100px;height:100px;object-fit:contain;margin-bottom:16px;opacity:0.5;">
            <h3>Nenhum grupo selecionado</h3>
            <p>Abra o menu ☰ e escolha um grupo</p>
        </div>

        <div id="tabTimeline" class="tab-content active">
            <div class="timeline" id="timelineFeed">
                <div class="loading-state">
                    <img src="logo.png" alt="Carregando" class="loading-mini-logo">
                    <p>Carregando atividades...</p>
                </div>
            </div>
        </div>

        <div id="tabDetalhes" class="tab-content">
            <div id="detalhesContent"></div>
        </div>

        <div id="tabRanking" class="tab-content">
            <div id="rankingContent"></div>
        </div>

        <div id="tabChat" class="tab-content">
            <div id="chatContent">
                <div class="chat-container">
                    <div class="chat-messages" id="chatMessages">
                        <div class="loading-state">
                            <img src="logo.png" alt="Carregando" class="loading-mini-logo">
                            <p>Carregando mensagens...</p>
                        </div>
                    </div>
                    <form class="chat-input-form" id="chatForm">
                        <input type="text" id="chatInput" placeholder="Digite sua mensagem..." autocomplete="off">
                        <button type="submit" class="btn btn-primary btn-sm">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Navegação Inferior -->
    <nav class="bottom-nav" id="bottomNav" style="display:none;">
        <button class="bottom-nav-item active" data-tab="tabTimeline">
            <i class="fas fa-home"></i>
            <span>Timeline</span>
        </button>
        <button class="bottom-nav-item" data-tab="tabDetalhes">
            <i class="fas fa-info-circle"></i>
            <span>Detalhes</span>
        </button>
        <button class="bottom-nav-item" data-tab="tabRanking">
            <i class="fas fa-trophy"></i>
            <span>Ranking</span>
        </button>
        <button class="bottom-nav-item" data-tab="tabChat">
            <i class="fas fa-comments"></i>
            <span>Chat</span>
        </button>
    </nav>

    <!-- FAB -->
    <button class="fab" id="fabRegister" title="Registrar Atividade">
        <i class="fas fa-camera"></i>
    </button>

    <!-- Modal Criar Grupo -->
    <div class="modal" id="createGroupModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Criar Novo Grupo</h3>
                <button class="icon-btn modal-close"><i class="fas fa-times"></i></button>
            </div>
            <form id="createGroupForm">
                <div class="input-group">
                    <label>Nome do Grupo *</label>
                    <input type="text" id="groupName" required maxlength="100" placeholder="Ex: Emagrecimento Time A">
                </div>
                <div class="input-group">
                    <label>Descrição</label>
                    <textarea id="groupDescription" rows="3" maxlength="500" placeholder="Descreva o propósito do grupo..."></textarea>
                </div>
                <div class="input-group">
                    <label>Limite de Participantes *</label>
                    <input type="number" id="groupMaxMembers" required min="2" max="100" value="10">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Criar Grupo</button>
            </form>
        </div>
    </div>

    <!-- Modal de Registro -->
    <div class="modal" id="registerSelectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📸 Registrar Atividade</h3>
                <button class="icon-btn modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p class="text-sm text-muted mb-2">Selecione os grupos para registrar atividade:</p>
                <div id="groupsChecklist"></div>
                <button class="btn btn-primary btn-block mt-2" id="confirmRegisterBtn">
                    <i class="fas fa-camera"></i> Ir para Registro
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Detalhes do Dia -->
    <div class="modal" id="dayDetailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="dayDetailTitle">Detalhes do Dia</h3>
                <button class="icon-btn modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="dayDetailBody"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>

    <!-- Esconde loading screen -->
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                var loading = document.getElementById('loadingScreen');
                if (loading) {
                    loading.classList.add('hidden');
                    setTimeout(function() { loading.remove(); }, 500);
                }
            }, 600);
        });
    </script>
</body>
</html>
