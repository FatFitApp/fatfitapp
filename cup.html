<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0c10">
    <meta name="mobile-web-app-capable" content="yes">
    <title>FATFIT - Chaveamento Copa 2026</title>
    <link rel="stylesheet" href="style.css?v=1.0.14">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0b0c10;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .cup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            padding-top: max(8px, env(safe-area-inset-top));
            background: #11141f;
            color: #ffcc00;
            flex-shrink: 0;
            z-index: 10;
        }
        
        .cup-header h1 {
            font-size: 1rem;
            font-weight: 700;
            margin: 0;
        }
        
        .canvas-container {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0c10;
        }

        svg {
            width: 100%;
            height: 100%;
            max-height: 100%;
            max-width: 100vw;
        }

        .link-pending {
            stroke: #222738;
            stroke-width: 2.5px;
            fill: none;
        }

        .link-eliminated {
            stroke: #161922;
            stroke-width: 2px;
            fill: none;
        }

        .link-active {
            stroke: #ffcc00;
            stroke-width: 4px;
            fill: none;
            stroke-linecap: round;
            filter: drop-shadow(0px 0px 5px rgba(255, 204, 0, 0.5));
        }

        .node-circle {
            fill: #1a1e2d;
            stroke: #363d56;
            stroke-width: 2px;
        }

        .node-group.active .node-circle {
            stroke: #ffcc00;
            stroke-width: 2.5px;
        }

        .node-group.pending .node-circle {
            stroke: #222738;
            stroke-dasharray: 4 4;
            fill: #0f111a;
        }

        .node-group.eliminated {
            filter: grayscale(100%);
            opacity: 0.25;
        }

        .node-emoji {
            user-select: none;
            dominant-baseline: central;
        }

        .center-circle {
            fill: #11141f;
            stroke: #ffcc00;
            stroke-dasharray: 4 4;
        }

        .center-circle-winner {
            fill: #1f253a;
            stroke: #ffcc00;
            stroke-width: 4px;
        }

        .pulsing {
            animation: centerGlow 2s infinite alternate;
        }

        @keyframes centerGlow {
            0% { filter: drop-shadow(0px 0px 8px rgba(255, 204, 0, 0.5)); }
            100% { filter: drop-shadow(0px 0px 25px rgba(255, 204, 0, 0.9)); }
        }
    </style>
</head>
<body>
    <div class="cup-header">
        <button class="icon-btn" onclick="history.back()" style="color:#ffcc00;">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h1>🏆 Copa 2026</h1>
        <div style="width:40px;"></div>
    </div>

    <div class="canvas-container">
        <svg id="bracket-svg" viewBox="0 0 1000 1000">
            <defs id="clip-defs"></defs>
            <g id="links-group"></g>
            <g id="nodes-group"></g>
        </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js?v=1.0.14"></script>
    <script src="app.js?v=1.0.14"></script>
</body>
</html>
