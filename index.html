<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
    <title>FATFIT</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4F46E5">
<!-- Apple PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="auth-page">
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <img src="logo.png" alt="FATFIT" class="loading-logo">
        <p class="loading-text">Carregando</p>
        <div class="loading-dots">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
        </div>
    </div>

    <div class="auth-container">
        <!-- Logo -->
        <div class="auth-logo">
            <div class="logo-icon">
                <img src="logo.png" alt="FATFIT" class="auth-logo-img">
            </div>
            <h1>FATFIT</h1>
            <p class="logo-subtitle">Transforme seu esforço em conquista</p>
        </div>

        <!-- Container dos formulários -->
        <div class="auth-card" id="authCard">
            <!-- Formulário de Login -->
            <form id="loginForm" class="auth-form active">
                <h2>Entrar</h2>
                
                <div class="input-group">
                    <label for="loginEmail">
                        <i class="fas fa-envelope"></i> E-mail
                    </label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com" required autocomplete="email">
                </div>

                <div class="input-group">
                    <label for="loginPassword">
                        <i class="fas fa-lock"></i> Senha
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" placeholder="Sua senha" required autocomplete="current-password">
                        <button type="button" class="toggle-password" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>

                <div class="auth-links">
                    <button type="button" class="link-btn" onclick="showForm('registerForm')">
                        Criar conta
                    </button>
                    <button type="button" class="link-btn" onclick="showForm('recoverForm')">
                        Esqueceu a senha?
                    </button>
                </div>
            </form>

            <!-- Formulário de Cadastro -->
            <form id="registerForm" class="auth-form">
                <h2>Criar Conta</h2>
                
                <div class="input-group">
                    <label for="registerName">
                        <i class="fas fa-user"></i> Nome
                    </label>
                    <input type="text" id="registerName" placeholder="Seu nome" required autocomplete="name">
                </div>

                <div class="input-group">
                    <label for="registerEmail">
                        <i class="fas fa-envelope"></i> E-mail
                    </label>
                    <input type="email" id="registerEmail" placeholder="seu@email.com" required autocomplete="email">
                </div>

                <div class="input-group">
                    <label for="registerPassword">
                        <i class="fas fa-lock"></i> Senha
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="registerPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                        <button type="button" class="toggle-password" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-user-plus"></i> Cadastrar
                </button>

                <div class="auth-links">
                    <button type="button" class="link-btn" onclick="showForm('loginForm')">
                        Já tenho conta
                    </button>
                </div>
            </form>

            <!-- Formulário de Recuperação de Senha -->
            <form id="recoverForm" class="auth-form">
                <h2>Recuperar Senha</h2>
                <p class="form-description">Enviaremos um link para seu e-mail</p>
                
                <div class="input-group">
                    <label for="recoverEmail">
                        <i class="fas fa-envelope"></i> E-mail
                    </label>
                    <input type="email" id="recoverEmail" placeholder="seu@email.com" required autocomplete="email">
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-paper-plane"></i> Enviar link
                </button>

                <div class="auth-links">
                    <button type="button" class="link-btn" onclick="showForm('loginForm')">
                        Voltar ao login
                    </button>
                </div>
            </form>

                        <!-- Formulário de Redefinir Senha (acessado via link do email) -->
            <form id="resetForm" class="auth-form">
                <h2>Redefinir Senha</h2>
                <p class="form-description">Digite sua nova senha</p>
                
                <div class="input-group">
                    <label for="resetPassword">
                        <i class="fas fa-lock"></i> Nova Senha
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="resetPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                        <button type="button" class="toggle-password" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-save"></i> Salvar Nova Senha
                </button>

                <div class="auth-links">
                    <button type="button" class="link-btn" onclick="showForm('loginForm')">
                        Voltar ao login
                    </button>
                </div>
            </form>
        </div>

        <!-- Toast container -->
        <div class="toast-container" id="toastContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
    
    <!-- Esconde loading screen após carregar -->
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                var loading = document.getElementById('loadingScreen');
                if (loading) {
                    loading.classList.add('hidden');
                    setTimeout(function() { loading.remove(); }, 500);
                }
            }, 800);
        });
    </script>
    <!-- Registrar Service Worker -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('✅ Service Worker registrado'))
                .catch(err => console.log('❌ Service Worker falhou:', err));
        });
    }
</script>
</body>
</html>
