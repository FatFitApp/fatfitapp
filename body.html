<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F2F2F7">
    <meta name="mobile-web-app-capable" content="yes">
    <title>FATFIT - Avaliação Física</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4F46E5">
</head>
<body class="body-page">
    <header class="body-header">
        <button class="body-back-btn" onclick="history.back()">
            <i class="fas fa-chevron-left"></i>
        </button>
        <h1 class="body-title">Avaliação Física</h1>
        <button class="body-add-btn" id="btnNewMeasurement">
            <i class="fas fa-plus"></i>
        </button>
    </header>

    <main class="body-main">
        <!-- ETAPA 0: Dashboard -->
        <div id="stepDashboard">
            <h2 class="body-section-title">Histórico</h2>
            <div class="body-card" id="dashboardContent">
                <div class="loading-state">
                    <img src="logo.png" alt="Carregando" class="loading-mini-logo">
                    <p>Carregando histórico...</p>
                </div>
            </div>
        </div>

        <!-- ETAPA 1: Dados Básicos -->
        <div id="stepBasic" style="display:none;">
            <h2 class="body-section-title">Nova Avaliação</h2>
            <div class="body-card">
                <p class="body-card-subtitle">Dados Básicos</p>
                <form id="formBasic">
                    <input type="hidden" id="editId">
                    <div class="body-input-group">
                        <label>Data</label>
                        <input type="date" id="measurementDate" required>
                    </div>
                    <div class="body-input-row">
                        <div class="body-input-group" style="flex:1;">
                            <label>Peso (kg)</label>
                            <input type="number" id="weightKg" required min="20" max="300" step="0.1" placeholder="75.5">
                        </div>
                        <div class="body-input-group" style="flex:1;">
                            <label>Altura (m)</label>
                            <input type="number" id="heightM" required min="0.5" max="2.5" step="0.01" placeholder="1.75">
                        </div>
                    </div>
                    <div class="imc-display" id="imcDisplay" style="display:none;">
                        <div class="imc-big" id="imcValue">--</div>
                        <div class="imc-label" id="imcClassification"></div>
                    </div>
                    <div class="body-btn-row">
                        <button type="button" class="btn btn-outline btn-sm" onclick="showStep('dashboard')">Voltar</button>
                        <button type="submit" class="btn btn-primary btn-sm">Próximo</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ETAPA 2: Perímetros -->
        <div id="stepPerimeters" style="display:none;">
            <h2 class="body-section-title">Medidas Corporais</h2>
            <div class="body-card">
                <p class="body-card-subtitle">Perímetros (opcional)</p>
                <div class="measure-row">
                    <div class="capybara-side">
                        <div class="capybara-box" id="capybaraContainer">
                            <img src="corpo.png" alt="Guia" class="capybara-img" id="capybaraBody">
                            <div class="highlight-overlay" id="highlightOverlay"></div>
                        </div>
                    </div>
                    <div class="inputs-side">
                        <div class="body-input-mini">
                            <label>Braço Relaxado</label>
                            <input type="number" id="armRelaxed" step="0.1" placeholder="32.5" data-region="braco_relaxado">
                        </div>
                        <div class="body-input-mini">
                            <label>Braço Contraído</label>
                            <input type="number" id="armContracted" step="0.1" placeholder="35.0" data-region="braco_contraido">
                        </div>
                        <div class="body-input-mini">
                            <label>Cintura</label>
                            <input type="number" id="waist" step="0.1" placeholder="80.0" data-region="cintura">
                        </div>
                        <div class="body-input-mini">
                            <label>Abdômen</label>
                            <input type="number" id="abdomen" step="0.1" placeholder="85.0" data-region="abdomen">
                        </div>
                        <div class="body-input-mini">
                            <label>Quadril</label>
                            <input type="number" id="hip" step="0.1" placeholder="100.0" data-region="quadril">
                        </div>
                        <div class="body-input-mini">
                            <label>Coxa Esq.</label>
                            <input type="number" id="thighLeft" step="0.1" placeholder="55.0" data-region="perna_esquerda">
                        </div>
                        <div class="body-input-mini">
                            <label>Coxa Dir.</label>
                            <input type="number" id="thighRight" step="0.1" placeholder="55.0" data-region="perna_direita">
                        </div>
                        <div class="body-input-mini">
                            <label>Panturrilha Esq.</label>
                            <input type="number" id="calfLeft" step="0.1" placeholder="37.0" data-region="panturrilha_esquerda">
                        </div>
                        <div class="body-input-mini">
                            <label>Panturrilha Dir.</label>
                            <input type="number" id="calfRight" step="0.1" placeholder="37.0" data-region="panturrilha_direita">
                        </div>
                    </div>
                </div>
                <div class="body-btn-row">
                    <button type="button" class="btn btn-outline btn-sm" onclick="showStep('basic')">Voltar</button>
                    <button type="button" class="btn btn-primary btn-sm" onclick="showStep('photos')">Próximo</button>
                </div>
            </div>
        </div>

        <!-- ETAPA 3: Fotos -->
        <div id="stepPhotos" style="display:none;">
            <h2 class="body-section-title">Fotos de Progresso</h2>
            <div class="body-card">
                <p class="body-card-subtitle">Até 3 fotos (opcional)</p>
                <div class="photo-protocol-mini">
                    <i class="fas fa-lightbulb"></i> Mantenha sempre a mesma posição e iluminação
                </div>
                <div class="photos-row">
                    <div class="photo-slot-mini" id="photoSlot1">
                        <input type="file" id="photoInput1" accept="image/*" hidden onchange="previewPhoto(1)">
                        <img id="photoPreview1" class="photo-thumb" style="display:none;">
                        <div class="photo-placeholder" onclick="document.getElementById('photoInput1').click()">
                            <i class="fas fa-camera"></i>
                        </div>
                    </div>
                    <div class="photo-slot-mini" id="photoSlot2">
                        <input type="file" id="photoInput2" accept="image/*" hidden onchange="previewPhoto(2)">
                        <img id="photoPreview2" class="photo-thumb" style="display:none;">
                        <div class="photo-placeholder" onclick="document.getElementById('photoInput2').click()">
                            <i class="fas fa-camera"></i>
                        </div>
                    </div>
                    <div class="photo-slot-mini" id="photoSlot3">
                        <input type="file" id="photoInput3" accept="image/*" hidden onchange="previewPhoto(3)">
                        <img id="photoPreview3" class="photo-thumb" style="display:none;">
                        <div class="photo-placeholder" onclick="document.getElementById('photoInput3').click()">
                            <i class="fas fa-camera"></i>
                        </div>
                    </div>
                </div>
                <div class="body-btn-row">
                    <button type="button" class="btn btn-outline btn-sm" onclick="showStep('perimeters')">Voltar</button>
                    <button type="button" class="btn btn-primary btn-sm" id="btnSaveMeasurement">Salvar</button>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
    <!-- Registrar Service Worker -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('✅ Service Worker registrado'))
                .catch(err => console.log('❌ Service Worker falhou:', err));
        });
    }
</script>
</body>
</html>
