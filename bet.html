<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F2F2F7">
    <meta name="mobile-web-app-capable" content="yes">
    <title>FATFIT - Bolão da Copa</title>
    <link rel="stylesheet" href="style.css?v=1.0.11">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="app-page">
    <header class="app-header">
        <button class="icon-btn" onclick="history.back()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h1 class="app-title">🏆 Bolão da Copa</h1>
        <button class="icon-btn" onclick="window.location.href='profile.html'">
            <i class="fas fa-user-circle"></i>
        </button>
    </header>

    <main class="main-content">
        <!-- Saldo do usuário -->
        <div id="betBalance" class="bet-balance-card" style="
            background: linear-gradient(135deg, #F59E0B, #EF4444);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            color: #FFFFFF;
            text-align: center;
        ">
            <div style="font-size:0.8rem;opacity:0.9;">Seu saldo para apostas</div>
            <div style="font-size:2rem;font-weight:800;" id="betBalanceAmount">🪙 0</div>
            <div style="font-size:0.7rem;opacity:0.8;">FATCoins</div>
        </div>

        <!-- Lista de jogos -->
        <div id="betContainer">
            <div class="loading-state">
                <img src="logo.png" alt="Carregando" class="loading-mini-logo">
                <p>Carregando jogos...</p>
            </div>
        </div>

        <!-- Minhas Apostas -->
        <div id="myBetsSection" style="margin-top:20px;">
            <h2 style="font-size:1rem;font-weight:700;color:#1C1C1E;margin-bottom:10px;">📋 Minhas Apostas</h2>
            <div id="myBetsContainer">
                <p class="text-sm text-muted">Carregando...</p>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js?v=1.0.11"></script>
    <script src="app.js?v=1.0.11"></script>
</body>
</html>
