<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4F46E5">
    <title>FATFIT - Buscar Grupos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="app-page">
    <header class="app-header">
        <button class="icon-btn" onclick="history.back()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h1 class="app-title">Buscar Grupos</h1>
        <div></div>
    </header>

    <main class="main-content">
        <div class="search-bar mb-2">
            <input type="text" id="searchInput" placeholder="Nome do grupo..." class="search-input">
            <button class="btn btn-primary" id="searchBtn">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <div class="section-header">
            <h2>Todos os Grupos</h2>
        </div>
        <div id="groupsList">
            <div class="loading-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Carregando grupos...</p>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
