<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4F46E5">
            <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
    <title>FATFIT - Buscar Grupos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4F46E5">
<!-- Apple PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="app-page">
    <header class="app-header">
        <button class="icon-btn" onclick="history.back()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h1 class="app-title">Buscar Grupos</h1>
        <div></div>
    </header>

    <main class="main-content">
        <!-- Barra de busca -->
        <div class="search-bar-modern mb-2">
            <div class="search-input-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Buscar por nome do grupo..." class="search-input-modern">
                <button class="search-clear-btn" id="clearSearchBtn" style="display:none;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- Contador -->
        <div class="flex-between mb-1">
            <p class="text-sm text-muted" id="groupsCount">Carregando...</p>
            <button class="btn btn-text btn-sm" id="refreshBtn">
                <i class="fas fa-sync-alt"></i> Atualizar
            </button>
        </div>

        <!-- Lista de Grupos -->
        <div id="groupsList">
            <div class="loading-state">
                <img src="logo.png" alt="Carregando" class="loading-mini-logo">
                <p>Buscando grupos...</p>
            </div>
        </div>

        <!-- Botão Carregar Mais -->
        <div id="loadMoreContainer" style="text-align:center;padding:16px;display:none;">
            <button class="btn btn-outline btn-block" id="loadMoreBtn">
                <i class="fas fa-chevron-down"></i> Carregar mais grupos
            </button>
        </div>

        <!-- Estado vazio -->
        <div id="emptyState" class="empty-state" style="display:none;">
            <img src="logo.png" alt="FATFIT" style="width:80px;height:80px;object-fit:contain;margin-bottom:12px;opacity:0.4;">
            <h3>Nenhum grupo encontrado</h3>
            <p class="text-sm text-muted">Tente outro termo de busca</p>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
    <!-- Registrar Service Worker -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('✅ Service Worker registrado'))
                .catch(err => console.log('❌ Service Worker falhou:', err));
        });
    }
</script>
</body>
</html>
