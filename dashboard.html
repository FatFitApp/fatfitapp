<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4F46E5">
    <title>FATFIT - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="app-page">
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <button class="icon-btn" id="menuBtn" aria-label="Menu">
                <i class="fas fa-bars"></i>
            </button>
            <h1 class="app-title">FATFIT</h1>
        </div>
        <div class="header-right">
            <button class="icon-btn" onclick="window.location.href='profile.html'" aria-label="Perfil">
                <i class="fas fa-user-circle"></i>
            </button>
        </div>
    </header>

    <!-- Sidebar Menu -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Menu</h2>
            <button class="icon-btn" id="closeSidebar">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="sidebar-content">
            <a href="dashboard.html" class="sidebar-item active">
                <i class="fas fa-home"></i> Início
            </a>
            <a href="profile.html" class="sidebar-item">
                <i class="fas fa-user"></i> Meu Perfil
            </a>
            <button class="sidebar-item" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Sair
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Buscar Grupos -->
        <section class="section search-section">
            <div class="search-bar">
                <input type="text" id="searchGroupInput" placeholder="Buscar grupos por nome..." class="search-input">
                <button class="btn btn-icon" id="searchGroupBtn">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </section>

        <!-- Meus Grupos -->
        <section class="section">
            <div class="section-header">
                <h2>Meus Grupos</h2>
                <button class="btn btn-primary btn-sm" id="createGroupBtn">
                    <i class="fas fa-plus"></i> Criar
                </button>
            </div>
            <div class="groups-grid" id="myGroupsGrid">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Carregando grupos...</p>
                </div>
            </div>
        </section>

        <!-- Entrar em Grupo por Código -->
        <section class="section">
            <div class="section-header">
                <h2>Entrar com Código</h2>
            </div>
            <div class="invite-code-form">
                <input type="text" id="inviteCodeInput" placeholder="Código de convite (8 caracteres)" maxlength="8" class="input-code">
                <button class="btn btn-secondary" id="joinGroupBtn">
                    <i class="fas fa-door-open"></i> Entrar
                </button>
            </div>
        </section>

        <!-- Resultados da Busca -->
        <section class="section" id="searchResultsSection" style="display:none;">
            <div class="section-header">
                <h2>Resultados da Busca</h2>
                <button class="btn btn-text" id="clearSearchBtn">
                    <i class="fas fa-times"></i> Limpar
                </button>
            </div>
            <div class="groups-grid" id="searchResultsGrid"></div>
        </section>
    </main>

    <!-- Modal Criar Grupo -->
    <div class="modal" id="createGroupModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Criar Novo Grupo</h3>
                <button class="icon-btn modal-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="createGroupForm">
                <div class="input-group">
                    <label for="groupName">Nome do Grupo *</label>
                    <input type="text" id="groupName" required maxlength="100" placeholder="Ex: Emagrecimento Time A">
                </div>
                <div class="input-group">
                    <label for="groupDescription">Descrição</label>
                    <textarea id="groupDescription" rows="3" maxlength="500" placeholder="Descreva o propósito do grupo..."></textarea>
                </div>
                <div class="input-group">
                    <label for="groupMaxMembers">Limite de Participantes *</label>
                    <input type="number" id="groupMaxMembers" required min="2" max="100" value="10" placeholder="Máximo de membros">
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-check"></i> Criar Grupo
                </button>
            </form>
        </div>
    </div>

    <!-- Modal Visualizar Grupo -->
    <div class="modal" id="viewGroupModal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3 id="viewGroupName">Grupo</h3>
                <button class="icon-btn modal-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="viewGroupBody">
                <!-- Preenchido dinamicamente -->
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts na ordem correta -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
